version: 2
# One combined PR per week for every ecosystem, instead of one PR per group.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
    target-branch: dev
updates:
  - package-ecosystem: cargo
    directory: /
    patterns: ['*']
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: bun
    directory: /web
    patterns: ['*']
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: docker
    directories:
      - /backend
      - /web
      - /proxy
      - /dev/seed
      - /dev/checks
    patterns: ['*']
    multi-ecosystem-group: all-dependencies
