name: React Native Build & Test

on:
  workflow_call:
    inputs:
      lightweight:
        type: boolean
        default: false
      enable_tests:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect initialized client
        id: client
        run: echo "ready=$(test -f mobile/package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Report placeholder
        if: steps.client.outputs.ready != 'true'
        run: echo "mobile/ is a placeholder; initialize the client to enable checks." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.client.outputs.ready == 'true'
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.client.outputs.ready == 'true'
        with:
          bun-version: '1.4.3'

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.client.outputs.ready == 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.3-mobile-${{ hashFiles('mobile/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.4.3-mobile-

      - name: Install dependencies
        if: steps.client.outputs.ready == 'true'
        working-directory: mobile
        run: bun ci
      - name: Run test
        if: steps.client.outputs.ready == 'true' && inputs.enable_tests
        working-directory: mobile
        run: |
          if jq -e '.scripts.test | type == "string"' package.json > /dev/null; then
            bun run test
          else
            echo "mobile: no test script configured; tests skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run build
        if: steps.client.outputs.ready == 'true' && !inputs.lightweight
        working-directory: mobile
        run: bun run --if-present build
      - name: Detect native Android project
        id: android
        run: echo "ready=$(test -f mobile/android/gradlew && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.client.outputs.ready == 'true' && steps.android.outputs.ready == 'true' && !inputs.lightweight
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android debug APK
        if: steps.client.outputs.ready == 'true' && steps.android.outputs.ready == 'true' && !inputs.lightweight
        working-directory: mobile/android
        run: bash ./gradlew assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.client.outputs.ready == 'true' && steps.android.outputs.ready == 'true' && !inputs.lightweight
        with:
          name: mobile-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
