name: React Native Build & Test

on:
  workflow_call:
    inputs:
      enable_tests:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Detect initialized client
        id: client
        run: echo "ready=$(test -f mobile/package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Report placeholder
        if: steps.client.outputs.ready != 'true'
        run: echo "mobile/ is a placeholder; initialize the client to enable checks." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.client.outputs.ready == 'true'
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.client.outputs.ready == 'true'
        with:
          bun-version: '1.4.2'

      - name: Cache Bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: steps.client.outputs.ready == 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.2-mobile-${{ hashFiles('mobile/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.4.2-mobile-

      - name: Install dependencies
        if: steps.client.outputs.ready == 'true'
        working-directory: mobile
        run: bun ci
      - name: Run test
        if: steps.client.outputs.ready == 'true' && inputs.enable_tests
        working-directory: mobile
        run: |
          if jq -e '.scripts.test | type == "string"' package.json > /dev/null; then
            bun run test
          else
            echo "mobile: no test script configured; tests skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run build
        if: steps.client.outputs.ready == 'true'
        working-directory: mobile
        run: bun run --if-present build
      - name: Detect native Android project
        id: android
        run: echo "ready=$(test -f mobile/android/gradlew && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.client.outputs.ready == 'true' && steps.android.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android debug APK
        if: steps.client.outputs.ready == 'true' && steps.android.outputs.ready == 'true'
        working-directory: mobile/android
        run: bash ./gradlew assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.client.outputs.ready == 'true' && steps.android.outputs.ready == 'true'
        with:
          name: mobile-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
