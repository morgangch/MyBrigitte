name: React Native Code & Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect initialized client
        id: client
        run: echo "ready=$(test -f mobile/package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Report placeholder
        if: steps.client.outputs.ready != 'true'
        run: echo "mobile/ is a placeholder; initialize the client to enable checks." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        if: steps.client.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        if: steps.client.outputs.ready == 'true'
        working-directory: mobile
        run: npm ci
      - name: Run lint
        if: steps.client.outputs.ready == 'true'
        working-directory: mobile
        run: npm run lint --if-present
      - name: Run format:check
        if: steps.client.outputs.ready == 'true'
        working-directory: mobile
        run: npm run format:check --if-present
      - name: Run typecheck
        if: steps.client.outputs.ready == 'true'
        working-directory: mobile
        run: npm run typecheck --if-present
