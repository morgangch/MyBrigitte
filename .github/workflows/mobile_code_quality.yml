name: React Native Code & Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Detect initialized client
        id: client
        run: echo "ready=$(test -f mobile/package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Report placeholder
        if: steps.client.outputs.ready != 'true'
        run: echo "mobile/ is a placeholder; initialize the client to enable checks." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.client.outputs.ready == 'true'
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.client.outputs.ready == 'true'
        with:
          bun-version: '1.4.2'

      - name: Cache Bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: steps.client.outputs.ready == 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.2-mobile-${{ hashFiles('mobile/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.4.2-mobile-

      - name: Install dependencies
        if: steps.client.outputs.ready == 'true'
        working-directory: mobile
        run: bun ci
      - name: Run lint
        if: steps.client.outputs.ready == 'true'
        working-directory: mobile
        run: bun run --if-present lint
      - name: Run format:check
        if: steps.client.outputs.ready == 'true'
        working-directory: mobile
        run: bun run --if-present format:check
      - name: Run typecheck
        if: steps.client.outputs.ready == 'true'
        working-directory: mobile
        run: bun run --if-present typecheck
