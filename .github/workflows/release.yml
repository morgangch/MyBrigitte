name: Publish GHCR Release

on:
  push:
    tags: ['v*', 'dev-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-${{ startsWith(github.ref_name, 'dev-') && 'dev' || github.ref_name == 'dev' && 'dev' || 'prod' }}
  cancel-in-progress: false

jobs:
  release_config:
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.config.outputs.channel }}
      environment: ${{ steps.config.outputs.environment }}
      image_suffix: ${{ steps.config.outputs.image_suffix }}
      registry: ${{ steps.config.outputs.registry }}
      version: ${{ steps.config.outputs.version }}
      prerelease: ${{ steps.config.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify tag ancestry and select channel
        id: config
        run: python3 scripts/release-channel.py
      - name: Verify release classification tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  checks:
    needs: [release_config]
    uses: ./.github/workflows/all_checks.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  test_docker_compose:
    needs: [checks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify development and production stacks
        run: bash scripts/docker-smoke.sh

  build_docker_images:
    needs: [release_config, checks, test_docker_compose]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: backend/Dockerfile.prod
          - service: web
            context: ./web
            dockerfile: web/Dockerfile.prod
          - service: proxy
            context: ./proxy
            dockerfile: proxy/Dockerfile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ needs.release_config.outputs.registry }}/${{ matrix.service }}${{ needs.release_config.outputs.image_suffix }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.release_config.outputs.version }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ needs.release_config.outputs.prerelease == 'false' || needs.release_config.outputs.channel == 'dev' }}
      - name: Build runtime image and push to GHCR
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            io.mybrigitte.environment=${{ needs.release_config.outputs.environment }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ needs.release_config.outputs.channel }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ needs.release_config.outputs.channel }}
      - name: Record published digest
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: ${{ needs.release_config.outputs.registry }}/${{ matrix.service }}${{ needs.release_config.outputs.image_suffix }}
          DIGEST: ${{ steps.push.outputs.digest }}
          CHANNEL: ${{ needs.release_config.outputs.channel }}
          VERSION: ${{ needs.release_config.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('image-' + os.environ['SERVICE'] + '.json').write_text(json.dumps({
              'service': os.environ['SERVICE'], 'image': os.environ['IMAGE'],
              'digest': os.environ['DIGEST'], 'channel': os.environ['CHANNEL'],
              'version': os.environ['VERSION'],
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ghcr-image-${{ matrix.service }}
          path: image-${{ matrix.service }}.json
          if-no-files-found: error

  create_release:
    needs: [release_config, build_docker_images]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ghcr-image-*
          path: release-images
          merge-multiple: true
      - name: Generate registry-based release notes
        env:
          CHANNEL: ${{ needs.release_config.outputs.channel }}
          VERSION: ${{ needs.release_config.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          images = [json.loads(p.read_text()) for p in sorted(Path('release-images').glob('image-*.json'))]
          assert {i['service'] for i in images} == {'backend', 'web', 'proxy'}
          assert all(i['channel'] == os.environ['CHANNEL'] and i['digest'].startswith('sha256:') for i in images)
          manifest = {'channel': os.environ['CHANNEL'], 'version': os.environ['VERSION'], 'images': images}
          Path('release-images.json').write_text(json.dumps(manifest, indent=2) + '\n')
          lines = ['# MyBrigitte ' + os.environ['VERSION'], '', 'All runtime images have been pushed to GHCR.', '', '```bash']
          lines += ['docker pull ' + i['image'] + '@' + i['digest'] for i in images]
          lines += ['```', '', 'Configure `BACKEND_IMAGE`, `WEB_IMAGE` and `PROXY_IMAGE` from the digest manifest, then run `docker compose pull` and `docker compose up -d --no-build --wait` with the environment-specific env file/project.', '',
                    'Only the reverse proxy publishes a port. PostgreSQL data remains in the environment-specific volume.',
                    'Development releases use separate `backend-dev`, `web-dev` and `proxy-dev` packages with runtime images, without local hot-reload tooling.',
                    'Server credentials, TLS and deployment approval remain environment-specific.']
          Path('release-notes.md').write_text('\n'.join(lines) + '\n')
          PY
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-images.json
          fail_on_unmatched_files: true
          prerelease: ${{ needs.release_config.outputs.prerelease == 'true' }}

  mirror:
    needs: [release_config, build_docker_images, create_release]
    if: github.event_name == 'push' && needs.create_release.result == 'success'
    uses: ./.github/workflows/mirror.yml
    secrets: inherit
