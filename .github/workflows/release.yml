name: Release Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/backend_code_quality.yml
  backend:
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo build -p backend --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: mybrigitte-backend-linux-x86_64
          path: target/release/backend
          if-no-files-found: error
  web:
    uses: ./.github/workflows/web_build_test.yml
  mobile:
    uses: ./.github/workflows/mobile_build_test.yml
