name: Web Code & Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect initialized client
        id: client
        run: echo "ready=$(test -f web/package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Report placeholder
        if: steps.client.outputs.ready != 'true'
        run: echo "web/ is a placeholder; initialize the client to enable checks." >> "$GITHUB_STEP_SUMMARY"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.client.outputs.ready == 'true'
        with:
          bun-version: '1.4.2'

      - name: Cache Bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: steps.client.outputs.ready == 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.2-web-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.4.2-web-

      - name: Install dependencies
        if: steps.client.outputs.ready == 'true'
        working-directory: web
        run: bun ci
      - name: Run lint
        if: steps.client.outputs.ready == 'true'
        working-directory: web
        run: bun run --if-present lint
      - name: Run format:check
        if: steps.client.outputs.ready == 'true'
        working-directory: web
        run: bun run --if-present format:check
      - name: Run typecheck
        if: steps.client.outputs.ready == 'true'
        working-directory: web
        run: bun run --if-present typecheck
