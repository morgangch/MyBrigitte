name: All Checks - MyBrigitte

on:
  pull_request:
  workflow_call:
    inputs:
      skip_tests:
        type: boolean
        default: false
      strict_validation:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      skip_tests:
        type: boolean
        default: false
      strict_validation:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository_validation:
    uses: ./.github/workflows/repository_validation.yml
    with:
      strict_mode: ${{ inputs.strict_validation || false }}
  backend_code_quality:
    if: needs.repository_validation.outputs.backend == 'true'
    needs: [repository_validation]
    uses: ./.github/workflows/backend_code_quality.yml
  backend_build_test:
    if: needs.repository_validation.outputs.backend == 'true'
    needs: [repository_validation]
    uses: ./.github/workflows/backend_build_test.yml
    with:
      lightweight: ${{ needs.repository_validation.outputs.full != 'true' }}
      enable_tests: ${{ !inputs.skip_tests }}
  web_code_quality:
    if: needs.repository_validation.outputs.web == 'true'
    needs: [repository_validation]
    uses: ./.github/workflows/web_code_quality.yml
  web_build_test:
    if: needs.repository_validation.outputs.web == 'true'
    needs: [repository_validation]
    uses: ./.github/workflows/web_build_test.yml
    with:
      lightweight: ${{ needs.repository_validation.outputs.full != 'true' }}
      enable_tests: ${{ !inputs.skip_tests }}
  mobile_code_quality:
    if: needs.repository_validation.outputs.mobile == 'true'
    needs: [repository_validation]
    uses: ./.github/workflows/mobile_code_quality.yml
  mobile_build_test:
    if: needs.repository_validation.outputs.mobile == 'true'
    needs: [repository_validation]
    uses: ./.github/workflows/mobile_build_test.yml
    with:
      lightweight: ${{ needs.repository_validation.outputs.full != 'true' }}
      enable_tests: ${{ !inputs.skip_tests }}
  security:
    needs: [repository_validation]
    uses: ./.github/workflows/security.yml
    with:
      full_scan: ${{ needs.repository_validation.outputs.full == 'true' }}
      scan_actions: ${{ needs.repository_validation.outputs.scan_actions == 'true' }}
    permissions:
      contents: read
      security-events: write
      actions: read
  coverage:
    if: needs.repository_validation.outputs.full == 'true'
    needs: [repository_validation]
    uses: ./.github/workflows/coverage.yml
  quality_gate:
    name: Quality Gate Decision
    if: always()
    needs: [repository_validation, backend_code_quality, backend_build_test, web_code_quality, web_build_test, mobile_code_quality, mobile_build_test, security, coverage]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require all checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-plan.py gate
