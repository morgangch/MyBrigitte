name: Web Build & Test

on:
  workflow_call:
    inputs:
      lightweight:
        type: boolean
        default: false
      enable_tests:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect initialized client
        id: client
        run: echo "ready=$(test -f web/package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Report placeholder
        if: steps.client.outputs.ready != 'true'
        run: echo "web/ is a placeholder; initialize the client to enable checks." >> "$GITHUB_STEP_SUMMARY"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.client.outputs.ready == 'true'
        with:
          bun-version: '1.4.3'

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.client.outputs.ready == 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.3-web-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.4.3-web-

      - name: Install dependencies
        if: steps.client.outputs.ready == 'true'
        working-directory: web
        run: bun ci
      - name: Run test
        if: steps.client.outputs.ready == 'true' && inputs.enable_tests
        working-directory: web
        run: |
          if jq -e '.scripts.test | type == "string"' package.json > /dev/null; then
            bun run test
          else
            echo "web: no test script configured; tests skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run build
        if: steps.client.outputs.ready == 'true' && !inputs.lightweight
        working-directory: web
        run: bun run --if-present build
