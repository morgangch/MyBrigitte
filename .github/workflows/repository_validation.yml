name: Repository Validation

on:
  workflow_call:
    outputs:
      full:
        value: ${{ jobs.validate.outputs.full }}
      backend:
        value: ${{ jobs.validate.outputs.backend }}
      web:
        value: ${{ jobs.validate.outputs.web }}
      mobile:
        value: ${{ jobs.validate.outputs.mobile }}
      scan_actions:
        value: ${{ jobs.validate.outputs.scan_actions }}
    inputs:
      strict_mode:
        description: Require initialized web and mobile clients
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.plan.outputs.full }}
      backend: ${{ steps.plan.outputs.backend }}
      web: ${{ steps.plan.outputs.web }}
      mobile: ${{ steps.plan.outputs.mobile }}
      scan_actions: ${{ steps.plan.outputs.scan_actions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Select check profile
        id: plan
        run: python3 scripts/ci-plan.py
      - name: Validate workflow syntax and CI policy tests
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate workspace and project structure
        run: |
          for file in Cargo.toml Cargo.lock backend/Cargo.toml backend/src/main.rs README.md CONTRIBUTING.md CODE_OF_CONDUCT.md backend/.env.example; do
            test -f "$file" || { echo "::error::Missing $file"; exit 1; }
          done
          cargo metadata --no-deps --locked --format-version 1 > /dev/null
          for client in web mobile; do
            test -d "$client" || { echo "::error::Missing $client/"; exit 1; }
            if [ -f "$client/package.json" ]; then
              jq -e 'type == "object"' "$client/package.json" > /dev/null
              test -s "$client/bun.lock" || { echo "::error::Missing or empty $client/bun.lock"; exit 1; }
            elif [ "$STRICT_MODE" = true ]; then
              echo "::error::Initialize $client before enabling strict validation"
              exit 1
            else
              echo "$client/ is a placeholder" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
        env:
          STRICT_MODE: ${{ inputs.strict_mode }}
