name: Repository Mirroring

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-${{ github.repository }}
  cancel-in-progress: false

jobs:
  push_to_mirror:
    name: "Mirror Repository"
    if: ${{ github.actor != 'github-actions[bot]' && vars.MIRROR_URL != '' && github.event.repository.ssh_url != vars.MIRROR_URL }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Mirror to external repository
        uses: pixta-dev/repository-mirroring-action@674e65a7d483ca28dafaacba0d07351bdcc8bd75 # v1
        with:
          target_repo_url: ${{ vars.MIRROR_URL }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Report mirroring status
        if: always()
        env:
          MIRROR_STATUS: ${{ job.status }}
        run: |
          {
            if [ "$MIRROR_STATUS" = success ]; then
              echo '## Repository mirrored successfully'
              echo
              echo 'Repository mirrored to the configured target.'
            else
              echo '## Mirroring failed'
              echo
              echo 'Check the mirroring job logs for details.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
