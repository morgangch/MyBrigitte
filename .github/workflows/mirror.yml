name: Repository Mirroring

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-${{ github.repository }}
  cancel-in-progress: false

jobs:
  push_to_mirror:
    name: "Mirror Repository"
    if: ${{ github.actor != 'github-actions[bot]' && vars.MIRROR_URL != '' && github.event.repository.ssh_url != vars.MIRROR_URL }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to external repository
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ vars.MIRROR_URL }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Report mirroring status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "## ✅ Repository Mirrored Successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Repository has been successfully mirrored to the target." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Mirroring Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Failed to mirror repository. Check the logs for details." >> $GITHUB_STEP_SUMMARY
          fi
