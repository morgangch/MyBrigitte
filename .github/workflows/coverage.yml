name: Backend Coverage

on:
  workflow_call:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: '1.99.0'
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: coverage
          prefix-key: v1-workspace
          cache-workspace-crates: true
          workspaces: ". -> target/llvm-cov-target"
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-llvm-cov
      - name: Run backend tests and generate coverage
        run: |
          cargo llvm-cov --locked -p backend --lcov --output-path coverage.lcov
          cargo llvm-cov report --html --output-dir coverage-html
          cargo llvm-cov report --summary-only >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: backend-coverage
          path: |
            coverage.lcov
            coverage-html/
          if-no-files-found: warn
          retention-days: 30
