name: mybrigitte-prod

x-logging: &logging
  driver: local
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    logging: *logging
    restart: unless-stopped
    image: postgres:18
    command: [postgres, -p, "${POSTGRES_PORT:-5432}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      PGPORT: ${POSTGRES_PORT:-5432}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -p "$$PGPORT"']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    logging: *logging
    image: ${BACKEND_IMAGE:-mybrigitte-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    command: [migration, up]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    logging: *logging
    image: ${BACKEND_IMAGE:-mybrigitte-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      PORT: ${PORT:-3001}
      MICROSOFT_APP_ID: ${MICROSOFT_APP_ID:-}
      MICROSOFT_SECRET: ${MICROSOFT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-}
    networks: [application, database]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent "http://127.0.0.1:$$PORT/health"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  web:
    restart: unless-stopped
    logging: *logging
    image: ${WEB_IMAGE:-mybrigitte-web:local}
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    networks: [application]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:80/]
      interval: 5s
      timeout: 3s
      retries: 20

  proxy:
    logging: *logging
    restart: unless-stopped
    image: ${PROXY_IMAGE:-mybrigitte-proxy:local}
    build:
      context: ./proxy
    environment:
      WEB_UPSTREAM: web:80
      API_UPSTREAM: backend:${PORT:-3001}
      CSP_POLICY: >-
        default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
        img-src 'self' data:; font-src 'self'; connect-src 'self';
        object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'
    ports:
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-80}:80'
    networks: [application]
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/proxy-health]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  application:
  database:
    internal: true
volumes:
  postgres_data:
